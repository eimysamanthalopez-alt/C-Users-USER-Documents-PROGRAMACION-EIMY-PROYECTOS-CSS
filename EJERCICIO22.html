<p class="informacion">
CSS permite mejorar el aspecto visual de una página web.
La propiedad padding se utiliza para añadir espacio entre
 el contenido de un elemento y su borde, lo que hace que el
texto se vea más ordenado y sea más fácil de leer. Este
 ejemplo muestra el efecto de esta propiedad.
</p>
