<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definicion de un estilo en funcion del contexto</title>
    <style>
        p strong{
            color: rgb(53, 0, 139);
        }
        h1 strong{
            color: rgb(100, 0, 139);
        }
    </style>
</head>
<body>
    <h1>Este es un titulo con <strong> texto en negrita</strong>.</h1>
    <p>Este es un parrafo con<strong>texto en negrita</strong>.</p>
</body>
</html>
